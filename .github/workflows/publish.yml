# Publish trigger: GitHub Release (published) or manual workflow_dispatch (tag input).
# Publishes @frapetti-dev/ansible-vaults to the GitHub Package Registry (npm.pkg.github.com),
# authenticated with the workflow's own GITHUB_TOKEN (packages: write).

name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: gpr-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@frapetti-dev"

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          package_version=$(node -p 'require("./package.json").version')
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "::error::release tag ($RELEASE_TAG) != package.json version ($expected_tag)"
            exit 1
          fi
          tag_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          head_commit=$(git rev-parse HEAD)
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "::error::checked-out commit ($head_commit) != tag $RELEASE_TAG ($tag_commit)"
            exit 1
          fi

      - name: Validate package contents
        run: npm pack --dry-run

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
